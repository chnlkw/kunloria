# deploy/secret.example.yaml — placeholder shape of the TLS secret.
#
# DO NOT commit real keys. Generate a self-signed pair for development:
#   ./deploy/gen-cert.sh
# or issue real certificates with cert-manager:
#   kubectl apply -f - <<EOF
#   apiVersion: cert-manager.io/v1
#   kind: Certificate
#   metadata: { name: kunloria-tls, namespace: kunloria-system }
#   spec:
#     secretName: kunloria-tls
#     dnsNames: [kunloria.kunloria-system.svc]
#     issuerRef: { name: selfsigned, kind: ClusterIssuer }
#   EOF
apiVersion: v1
kind: Secret
metadata:
  name: kunloria-tls
  labels:
    app.kubernetes.io/name: kunloria
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    ... (from gen-cert.sh or cert-manager)
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    ...
    -----END PRIVATE KEY-----
