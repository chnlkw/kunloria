# deploy/deployment.yaml — 2 replicas, anti-affinity, resources, TLS sidecar.
#
# The kunloria container speaks plain HTTP on 8080 (loopback-pod only).
# An nginx sidecar terminates TLS on 8443 for the Kubernetes API server
# (ValidatingWebhookConfiguration requires HTTPS). Certificates come from
# the kunloria-tls Secret (see secret.example.yaml / gen-cert.sh, or use
# cert-manager).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kunloria
  labels:
    app.kubernetes.io/name: kunloria
    app.kubernetes.io/component: policy-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kunloria
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kunloria
        app.kubernetes.io/component: policy-engine
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kunloria
      containers:
        - name: kunloria
          image: ghcr.io/chnlkw/kunloria-rgw-tenant:dev
          imagePullPolicy: IfNotPresent
          args: []
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KUNLORIA_HOST
              value: "127.0.0.1" # only the TLS sidecar talks to us
            - name: KUNLORIA_PORT
              value: "8080"
            # The policy is baked into this image (see examples/rgw-tenant);
            # there are no policy environment variables (ADR-0001).
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: nginx-tls
          image: nginx:1.27-alpine
          ports:
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: tls
              mountPath: /etc/nginx/tls:ro
            - name: conf
              mountPath: /etc/nginx/conf.d:ro
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"] # nginx master drops privileges itself
      volumes:
        - name: tls
          secret:
            secretName: kunloria-tls
        - name: conf
          configMap:
            name: kunloria-nginx-conf
